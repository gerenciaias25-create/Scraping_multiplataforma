<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADAR - Inteligencia Político-Electoral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .loader {
      border-top-color: #3B82F6;
      -webkit-animation: spinner 1.5s linear infinite;
      animation: spinner 1.5s linear infinite;
    }
    @-webkit-keyframes spinner {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid me-2 fa-radar text-blue-500 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wider text-white">RADAR <span class="text-xs px-2 py-0.5 rounded bg-blue-600/30 text-blue-400 font-mono">v2.0</span></h1>
      </div>
      <div class="text-xs text-slate-400 font-mono">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 me-1"></span> Sistema Operativo
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    
    <!-- Panel de Control / Formulario -->
    <section class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-xl backdrop-blur-sm">
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-blue-400"></i> Parámetros de Análisis
      </h2>
      
      <form id="radarForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
        
        <!-- Skill -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Módulo / Skill</label>
          <select id="skill" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="radar">Radar Competitivo</option>
            <option value="emociones">Mapa de Emociones</option>
            <option value="tensiones">Matriz de Tensiones</option>
            <option value="opositor">Expediente Opositor</option>
          </select>
        </div>

        <!-- Actor 1 -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Actor Principal *</label>
          <input type="text" id="actor" required placeholder="Ej: Claudia Sheinbaum" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Actor 2 (Opcional) -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Actor Secundario / Opositor</label>
          <input type="text" id="actor2" placeholder="Opcional" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Mes -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Mes</label>
          <select id="mes" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="Enero">Enero</option>
            <option value="Febrero">Febrero</option>
            <option value="Marzo">Marzo</option>
            <option value="Abril">Abril</option>
            <option value="Mayo">Mayo</option>
            <option value="Junio">Junio</option>
            <option value="Julio">Julio</option>
            <option value="Agosto" selected>Agosto</option>
            <option value="Septiembre">Septiembre</option>
            <option value="Octubre">Octubre</option>
            <option value="Noviembre">Noviembre</option>
            <option value="Diciembre">Diciembre</option>
          </select>
        </div>

        <!-- Año -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Año</label>
          <select id="anio" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
          </select>
        </div>

        <!-- Botón submit -->
        <div class="lg:col-span-5 flex justify-end mt-2">
          <button type="submit" id="btnAnalizar" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
            <i class="fa-solid fa-bolt"></i> Ejecutar Análisis Masivo
          </button>
        </div>
      </form>
    </section>

    <!-- Estado de Procesamiento / Loader -->
    <section id="statusSection" class="hidden bg-slate-800/40 border border-slate-700 rounded-xl p-8 text-center space-y-4">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12 mx-auto"></div>
      <div class="space-y-1">
        <h3 id="statusTitle" class="text-base font-semibold text-slate-200">Iniciando procesamiento...</h3>
        <p id="statusProgreso" class="text-xs text-slate-400 font-mono">Enviando solicitud al servidor...</p>
      </div>
    </section>

    <!-- Display de Resultados -->
    <section id="resultsSection" class="hidden space-y-6">
      <!-- Resumen Ejecutivo Banner -->
      <div class="bg-gradient-to-r from-blue-900/40 to-slate-800 border border-blue-500/30 rounded-xl p-6 shadow-xl">
        <div class="flex items-center gap-3 mb-2">
          <i class="fa-solid fa-file-contract text-blue-400 text-lg"></i>
          <h2 class="text-lg font-bold text-white">Resumen Ejecutivo</h2>
        </div>
        <p id="resumenEjecutivoText" class="text-sm text-slate-300 leading-relaxed">Procesando datos...</p>
      </div>

      <!-- Contenedores Dinámicos -->
      <div id="outputContainer" class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 min-h-[300px]">
        <!-- Aquí se inyectan dinámicamente las tarjetas, tablas o JSON -->
      </div>
    </section>

  </main>

  <script>
    const radarForm = document.getElementById('radarForm');
    const btnAnalizar = document.getElementById('btnAnalizar');
    const statusSection = document.getElementById('statusSection');
    const statusTitle = document.getElementById('statusTitle');
    const statusProgreso = document.getElementById('statusProgreso');
    const resultsSection = document.getElementById('resultsSection');
    const resumenEjecutivoText = document.getElementById('resumenEjecutivoText');
    const outputContainer = document.getElementById('outputContainer');

    let pollingInterval = null;

    radarForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        skill: document.getElementById('skill').value,
        actor: document.getElementById('actor').value,
        actor2: document.getElementById('actor2').value,
        mes: document.getElementById('mes').value,
        anio: document.getElementById('anio').value,
      };

      // Limpiar interfaz
      resultsSection.classList.add('hidden');
      statusSection.classList.remove('hidden');
      btnAnalizar.disabled = true;
      btnAnalizar.classList.add('opacity-50', 'cursor-not-allowed');

      try {
        // 1. Iniciar trabajo
        const response = await fetch('/api/analizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error al iniciar análisis.');
        }

        const jobId = data.jobId;
        statusTitle.textContent = "Procesando en segundo plano...";
        
        // 2. Hacer Polling continuo cada 3 segundos
        pollingInterval = setInterval(() => consultarEstado(jobId), 3000);

      } catch (err) {
        alert(`Error: ${err.message}`);
        statusSection.classList.add('hidden');
        btnAnalizar.disabled = false;
        btnAnalizar.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });

    async function consultarEstado(jobId) {
      try {
        const res = await fetch(`/api/estado/${jobId}`);
        const job = await res.json();

        if (!res.ok) {
          clearInterval(pollingInterval);
          throw new Error(job.error || 'Job expirado o no encontrado.');
        }

        if (job.status === 'processing') {
          statusProgreso.textContent = job.progreso || 'Procesando fuentes en vivo...';
        } else if (job.status === 'done') {
          clearInterval(pollingInterval);
          statusSection.classList.add('hidden');
          btnAnalizar.disabled = false;
          btnAnalizar.classList.remove('opacity-50', 'cursor-not-allowed');
          
          mostrarResultados(job.result);
        } else if (job.status === 'error') {
          clearInterval(pollingInterval);
          statusSection.classList.add('hidden');
          btnAnalizar.disabled = false;
          btnAnalizar.classList.remove('opacity-50', 'cursor-not-allowed');
          alert(`Ocurrió un error: ${job.detail || job.error}`);
        }
      } catch (e) {
        console.error("Error al consultar el job:", e);
      }
    }

    function mostrarResultados(result) {
      resultsSection.classList.remove('hidden');
      const data = result.data;

      // Resumen ejecutivo
      resumenEjecutivoText.textContent = data.resumenEjecutivo || "Sin resumen ejecutivo.";

      // Inyectar visualización según la Skill
      outputContainer.innerHTML = `<pre class="text-xs text-emerald-400 bg-slate-950 p-4 rounded-lg overflow-x-auto font-mono">${JSON.stringify(data, null, 2)}</pre>`;
    }
  </script>
</body>
</html>
